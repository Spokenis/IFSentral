listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol websockets

# Segurança: desabilitar acesso anônimo
allow_anonymous false

# Arquivo de senhas (gerado automaticamente)
password_file /mosquitto/config/passwords.txt

# Arquivo ACL (gerado automaticamente)
acl_file /mosquitto/config/acl.acl

# Persistência
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type all

