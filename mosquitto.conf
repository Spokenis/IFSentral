listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol websockets

# Listener TLS — mesmos certificados usados pelo Apache (gerados por
# setup-ssl.sh). 1883 continua disponível em paralelo para não quebrar
# dispositivos já configurados; TLS é a opção recomendada para novos devices.
# Só autenticação de servidor (certfile/keyfile) — a autenticação do
# dispositivo continua por usuário/senha, não por certificado de cliente.
listener 8883 0.0.0.0
certfile /etc/ssl/certs/ifsentral-chain.crt
keyfile /etc/ssl/private/ifsentral.key

# Segurança: desabilitar acesso anônimo
allow_anonymous false

# Arquivo de senhas (gerado automaticamente)
password_file /mosquitto/config/passwords.txt

# Arquivo ACL (gerado automaticamente)
acl_file /mosquitto/config/acl.acl

# Persistência
persistence true
persistence_location /mosquitto/data/

# Sessões persistentes de clientes que não voltam (ex.: workers de versões
# antigas, que usavam um ID novo a cada início) expiram depois de 1 dia
# offline — enquanto existem, recebem parte das mensagens do $share/... e
# essas mensagens nunca chegam ao banco.
persistent_client_expiration 1d

# Logs
log_dest stdout
log_type all

