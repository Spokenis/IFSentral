listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol websockets

# Listener TLS — mesmos certificados usados pelo Apache (gerados por
# setup-ssl.sh). 1883 continua disponível em paralelo para não quebrar
# dispositivos já configurados; TLS é a opção recomendada para novos devices.
# Só autenticação de servidor (certfile/keyfile) — a autenticação do
# dispositivo continua por usuário/senha, não por certificado de cliente.
listener 8883 0.0.0.0
certfile /etc/ssl/certs/ifsentral-chain.crt
keyfile /etc/ssl/private/ifsentral.key
# Mesmas cifras do site (nginx): só ECDHE + AEAD, sem CBC (LUCKY13), TLS 1.2+.
# O ESP32 negocia ECDHE-RSA-AES128-GCM-SHA256.
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

# Segurança: desabilitar acesso anônimo
allow_anonymous false

# Arquivo de senhas (gerado automaticamente)
password_file /mosquitto/config/passwords.txt

# Arquivo ACL (gerado automaticamente)
acl_file /mosquitto/config/acl.acl

# Persistência
persistence true
persistence_location /mosquitto/data/

# Sessões persistentes de clientes que não voltam (ex.: workers de versões
# antigas, que usavam um ID novo a cada início) expiram depois de 1 dia
# offline — enquanto existem, recebem parte das mensagens do $share/... e
# essas mensagens nunca chegam ao banco.
persistent_client_expiration 1d

# Fila por cliente. O padrão (1000 mensagens) fazia o broker DESCARTAR o que
# passasse disso enquanto o worker gravava no banco — e o dispositivo já tinha
# recebido o PUBACK, então a leitura sumia sem aviso (teste de carga de
# 08/11/2026: 73% perdidas com o banco lento). Com a fila grande, uma rajada ou
# um banco lento só atrasam a gravação. Sem limite de bytes; ~200 bytes por
# leitura = ~40 MB no pior caso.
max_queued_messages 200000

# Logs (sem "debug": com log_type all cada PUBLISH/PUBACK virava uma linha,
# milhares por minuto sob carga)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

