# Logs do Docker com rotação: sem isto o arquivo de cada contêiner crescia até
# encher o disco (o broker, com log detalhado, gerava milhares de linhas por
# minuto sob carga). 3 arquivos de 10 MB por contêiner.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Configuração comum aos dois contêineres web (web e web-2). Ficam atrás do
# proxy: na atualização (manutencao/atualizar.sh) são trocados um de cada vez,
# e o site não sai do ar.
x-web: &web
  image: ifsentral-app:latest
  logging: *logging
  environment:
    - ROLE=web
    - DB_HOST=${DB_HOST:-db}
    - DB_NAME=${DB_NAME:-ifsentral_bd}
    - DB_USER=${DB_USER:-ifsentral_user}
    - DB_PASS=${DB_PASS:-secretpassword}
    - MQTT_HOST=${MQTT_HOST:-mosquitto}
    - MQTT_PORT=${MQTT_PORT:-1883}
    - MQTT_USERNAME=${MQTT_USERNAME:-admin}
    - MQTT_PASSWORD=${MQTT_PASSWORD:-ifsentral_admin_2024}
    # Porta HTTPS exposta no host (usada pelo .htaccess para montar o
    # redirect HTTP->HTTPS com a porta correta quando o Apache é acessado
    # sem o proxy).
    - HTTPS_PORT=${HOST_HTTPS_PORT:-8443}
    # Conexão persistente com o MySQL em cada processo do Apache (ver src/config/db.php)
    - DB_PERSISTENT=1
  volumes:
    # Configuração (.env) montada somente leitura: fica fora da imagem (ver .dockerignore)
    - ./.env:/var/www/html/.env:ro
    - ./logs:/var/www/html/logs
    - ./uploads:/var/www/html/uploads
    # Sessões compartilhadas pelos dois contêineres web (ver Dockerfile)
    - php_sessions:/var/lib/php/sessions
    # Mount host-managed config and certs (read-only) so TLS and secrets
    # live outside the image. Ensure /etc/ifsentral and cert paths exist on host (run ./setup-ssl.sh).
    - /etc/ifsentral:/etc/ifsentral:ro
    - /etc/ssl/certs/ifsentral-chain.crt:/etc/ssl/certs/ifsentral-chain.crt:ro
    - /etc/ssl/private/ifsentral.key:/etc/ssl/private/ifsentral.key:ro
    - mqtt_config:/mosquitto/config
  depends_on:
    db:
      condition: service_healthy
    mosquitto:
      condition: service_started
  healthcheck:
    # PHP + configuração + banco (src/api/saude.php)
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "X-Forwarded-Proto: https", "http://localhost/api/saude"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s
  restart: unless-stopped

services:

  # 1. Proxy de entrada (nginx): TLS e repartição entre web e web-2
  proxy:
    image: nginx:1.28-alpine
    container_name: ifsentral_proxy
    # In production on the intranet bind to 80/443. For local testing you can
    # change to a different host port (e.g. 8080:80).
    ports:
      - "${HOST_HTTP_PORT:-8080}:80"
      - "${HOST_HTTPS_PORT:-8443}:443"
    environment:
      - HTTPS_PORT=${HOST_HTTPS_PORT:-8443}
    volumes:
      # A pasta, não o arquivo: um arquivo montado sozinho continua com o
      # conteúdo antigo depois que o git pull o substitui
      - ./docker/nginx:/etc/nginx/templates:ro
      - /etc/ssl/certs/ifsentral-chain.crt:/etc/ssl/certs/ifsentral-chain.crt:ro
      - /etc/ssl/private/ifsentral.key:/etc/ssl/private/ifsentral.key:ro
    depends_on:
      - web
      - web-2
    logging: *logging
    restart: unless-stopped

  # 2. Web Server (PHP/Apache) — duas cópias iguais atrás do proxy
  web:
    <<: *web
    build: .
    container_name: ifsentral_web

  web-2:
    <<: *web
    container_name: ifsentral_web_2

  # 3. Background Worker (Executa o MQTT Subscriber)
  worker:
    image: ifsentral-app:latest
    container_name: ifsentral_worker
    # Hostname fixo = ID MQTT fixo (ver MQTT_CLIENT_ID em src/config/mqtt.php):
    # o worker retoma a mesma sessão no broker mesmo se o contêiner for recriado.
    hostname: ifsentral-worker
    environment:
      - ROLE=worker
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-ifsentral_bd}
      - DB_USER=${DB_USER:-ifsentral_user}
      - DB_PASS=${DB_PASS:-secretpassword}
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-admin}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-ifsentral_admin_2024}
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./logs:/var/www/html/logs
      - mqtt_config:/mosquitto/config
      - /etc/ifsentral:/etc/ifsentral:ro
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    logging: *logging
    restart: unless-stopped
    # O PHP (PID 1) ignora o SIGTERM, e o docker stop esperaria 10 s à toa.
    # Encerrar na hora é seguro: o broker reentrega o que não foi confirmado
    # (worker) e a ponte recupera pelo Storage do TTN (ttn-bridge).
    stop_grace_period: 3s
    command: ["docker-entrypoint.sh"]
    # O worker toca /tmp/worker-vivo a cada iteração do laço MQTT (no máximo
    # a cada 30 s). Se o arquivo envelhecer 2 min, o laço travou: o contêiner
    # fica "unhealthy" no docker compose ps e o atualizar.sh desfaz a troca.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-vivo 2>/dev/null || echo 0) )) -lt 120"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 60s

  # (Houve um segundo worker, com assinatura compartilhada $share/...; foi
  # retirado em 09/11/2026: o Mosquitto não restaura assinaturas
  # compartilhadas quando reinicia, e o worker único com assinatura comum não
  # perde mensagens nesse caso. Ver src/mqtt/mqtt_subscriber.php.)

  # 4. Ponte com o The Things Network (MQTT do TTN + Storage Integration -> banco)
  # Só faz algo para projetos com a integração TTN configurada.
  ttn-bridge:
    image: ifsentral-app:latest
    container_name: ifsentral_ttn_bridge
    hostname: ifsentral-ttn-bridge
    environment:
      - ROLE=ttn-bridge
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-ifsentral_bd}
      - DB_USER=${DB_USER:-ifsentral_user}
      - DB_PASS=${DB_PASS:-secretpassword}
    volumes:
      - ./.env:/var/www/html/.env:ro
      - /etc/ifsentral:/etc/ifsentral:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
    # O PHP (PID 1) ignora o SIGTERM, e o docker stop esperaria 10 s à toa.
    # Encerrar na hora é seguro: o broker reentrega o que não foi confirmado
    # (worker) e a ponte recupera pelo Storage do TTN (ttn-bridge).
    stop_grace_period: 3s
    command: ["docker-entrypoint.sh"]

  # 5. Database Server (MySQL)
  db:
    image: mysql:8.0
    container_name: ifsentral_db
    # --skip-log-bin: o log binário (padrão do MySQL 8) só serve para
    # replicação e recuperação ponto a ponto, que não são usadas (o backup é
    # por mysqldump); ele dobrava as escritas em disco de cada gravação. No
    # teste de carga de 08/11/2026 a latência p95 do envio HTTP caiu de 820
    # para 287 ms e o worker MQTT gravou o dobro por segundo.
    # --max-connections: os dois web têm até 60 processos cada (ver
    # docker/apache/mpm-limites.conf), mais workers, ponte TTN e backup — com o
    # padrão (151) o excedente virava HTTP 500 sob pico.
    # --innodb-buffer-pool-size: cache dos dados e índices na memória. O
    # padrão (128 MB) é pouco para meses de leituras; com 1 GB os gráficos
    # leem da memória em vez do disco. Num servidor com pouca RAM, ajuste
    # DB_BUFFER_POOL no .env (ex.: 512M).
    # --innodb-flush-log-at-trx-commit=2: cada COMMIT vai para o sistema
    # operacional na hora, mas a escrita física no disco acontece 1x por
    # segundo (com 1, o padrão, era uma escrita física por COMMIT). Se o
    # MySQL cair, nada se perde; numa QUEDA DE ENERGIA perde-se até ~1 s de
    # leituras. Por isso pressupõe nobreak no servidor. Para voltar ao modo
    # mais seguro (e mais lento em disco mecânico): DB_FLUSH_LOG=1 no .env.
    # --thread-cache-size / --back-log: cada requisição do PHP abre e fecha uma
    # conexão; a ~1.000 req/s (teste de carga com leitura e escrita juntas) o
    # MySQL, que guardava só 10 threads para reuso, criava uma por conexão, as
    # conexões se acumulavam até o limite e o excedente virava HTTP 500.
    # Com 128 threads reaproveitadas, fila de entrada maior e limite de 300.
    command: ["--skip-log-bin", "--max-connections=300", "--thread-cache-size=128", "--back-log=512", "--innodb-buffer-pool-size=${DB_BUFFER_POOL:-1G}", "--innodb-flush-log-at-trx-commit=${DB_FLUSH_LOG:-2}"]
    # Só na própria máquina: o Docker publica portas passando por cima do
    # firewall (UFW), e no teste de 09/11/2026 o MySQL respondia pelo IP de
    # rede. Para acessar de outro computador, use um túnel SSH.
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-ifsentral_bd}
      MYSQL_USER: ${DB_USER:-ifsentral_user}
      MYSQL_PASSWORD: ${DB_PASS:-secretpassword}
    volumes:
      - db_data:/var/lib/mysql
      - ./src/db/ifsentral_bd.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # 127.0.0.1 (TCP), não localhost (socket): durante a importação inicial o
      # MySQL já responde pelo socket mas ainda não aceita conexões TCP, que é
      # como os outros contêineres se conectam
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASS:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Na primeira subida (volume vazio), o entrypoint oficial do MySQL importa
      # src/db/ifsentral_bd.sql antes de aceitar conexões — isso pode levar
      # bem mais que os 30s antigos. Um start_period curto demais faz o
      # docker compose desistir e abortar web/worker com "dependency failed
      # to start: container ifsentral_db is unhealthy" no meio da importação.
      # Num HD a primeira subida levou ~8 min (teste de 09/11/2026) e 180 s
      # não bastavam; durante o start_period as falhas não contam e o banco
      # fica "healthy" assim que responde, então um prazo longo não atrasa nada.
      start_period: 900s
    logging: *logging
    restart: unless-stopped

  # 6. MQTT Broker (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: ifsentral_mqtt
    entrypoint: ["/usr/local/bin/mosquitto-entrypoint.sh"]
    command: []
    environment:
      # Sem isso, o bootstrap do mosquitto-entrypoint.sh cria o usuário admin
      # padrão com a senha fixa de fallback em vez da MQTT_PASSWORD definida
      # no .env, causando "not authorised" para o worker logo na primeira subida.
      - MQTT_USERNAME=${MQTT_USERNAME:-admin}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-ifsentral_admin_2024}
    ports:
      - "1883:1883"
      - "8883:8883"
      # WebSocket sem TLS: nada na plataforma usa; fica só na própria máquina
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto-entrypoint.sh:/usr/local/bin/mosquitto-entrypoint.sh:ro
      - mqtt_config:/mosquitto/config
      - mqtt_data:/mosquitto/data
      # Mesmos certificados usados pelo Apache (ver setup-ssl.sh) — montados
      # read-only, exatamente como no serviço web/worker.
      - /etc/ssl/certs/ifsentral-chain.crt:/etc/ssl/certs/ifsentral-chain.crt:ro
      - /etc/ssl/private/ifsentral.key:/etc/ssl/private/ifsentral.key:ro
    healthcheck:
      # Checa 1883 e 8883: se o certificado estiver com problema, o listener
      # TLS falha ao subir mesmo com o broker "saudável" em 1883.
      # Usa 127.0.0.1 (não "localhost"): o mosquitto.conf só faz bind em
      # IPv4 (0.0.0.0), e "localhost" resolve para ::1 primeiro neste
      # container — o que faz o healthcheck falhar sempre, mesmo com o
      # broker funcionando normalmente.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 && nc -z 127.0.0.1 8883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging
    restart: unless-stopped

  # 7. Backup automático do banco e das fotos de perfil (ver README, "Backup automático")
  backup:
    image: mysql:8.0
    container_name: ifsentral_backup
    entrypoint: ["bash", "/backup/agendador.sh"]
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-ifsentral_bd}
      - DB_USER=${DB_USER:-ifsentral_user}
      - DB_PASS=${DB_PASS:-secretpassword}
      # Horários (HH:MM, separados por espaço) e por quantos dias guardar
      - BACKUP_HORARIOS=${BACKUP_HORARIOS:-03:00}
      - BACKUP_MANTER_DIAS=${BACKUP_MANTER_DIAS:-14}
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - ./docker/backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./uploads:/dados/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # "unhealthy" se o último backup bem-sucedido tiver mais de 26 horas
      test: ["CMD", "bash", "/backup/verificar.sh"]
      interval: 10m
      timeout: 10s
      retries: 1
    logging: *logging
    restart: unless-stopped

volumes:
  db_data:
  mqtt_data:
  mqtt_config:
  php_sessions: