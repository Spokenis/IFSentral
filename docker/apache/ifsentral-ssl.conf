<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ifsentral.online
    ServerAdmin suporte@ifsentral.online
    DocumentRoot /var/www/html

    # Use certificates mounted from host
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ifsentral-chain.crt
    SSLCertificateKeyFile /etc/ssl/private/ifsentral.key

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ifsentral-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ifsentral-ssl-access.log combined
</VirtualHost>
</IfModule>
