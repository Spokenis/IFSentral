# Limite de processos do Apache em cada contêiner web.
#
# O padrão do prefork (150) nos dois contêineres somava 300 processos, cada um
# com sua conexão ao MySQL (limite 151): sob pico, o excedente recebia HTTP 500
# (teste de carga de 08/11/2026: 37 mil erros com 200 conexões simultâneas).
# Com 60 por contêiner (120 no total, abaixo do --max-connections do
# docker-compose.yml), o que passar disso espera na fila do Apache em vez de
# falhar — e a memória fica limitada (~15 MB por processo).
<IfModule mpm_prefork_module>
    StartServers             5
    MinSpareServers          5
    MaxSpareServers         15
    MaxRequestWorkers       60
    MaxConnectionsPerChild 10000
</IfModule>
